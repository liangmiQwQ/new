name: Template Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Templates add the latest dependencies, so they can break without any change here
  schedule:
    - cron: '0 0 * * 1'

  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stack: [rust, js-lib, js-cli]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      # `oxc-project/setup-rust` needs a `rust-toolchain.toml` at the repo root, which only the template has
      - name: Setup Rust
        if: matrix.stack == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust tools
        if: matrix.stack == 'rust'
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-shear,dprint

      - name: Setup Vite+
        if: startsWith(matrix.stack, 'js-')
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: lts/*

      - name: Check ${{ matrix.stack }}
        run: scripts/check.sh ${{ matrix.stack }}
